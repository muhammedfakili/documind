[project]
name = "documind"
version = "0.1.0"
description = "Retrieval-augmented Q&A over a company knowledge base, built and measured stage by stage"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.143.0",
    "fastembed>=0.8.1",
    "google-genai>=2.25.0",
    "openai>=3.25.0",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fpdf2>=2.8.8",
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
langchain = [
    "langchain-classic>=1.0.8",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.9",
    "langchain-google-genai>=4.4.1",
    "langchain-text-splitters>=1.1.3",
    "rank-bm25>=0.2.2",
]
# A13: the chat screen's own packages. The API's Docker image leaves them out
# (--no-default-groups); the UI's image installs only these (--only-group ui).
ui = [
    "httpx>=0.28.1",
    "streamlit>=1.65.0",
]

[tool.uv]
default-groups = ["dev", "ui", "langchain"]  # locally: everything (langchain: A14 comparison only)

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
